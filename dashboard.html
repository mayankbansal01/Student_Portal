<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1 id="heading">Welcome to Student Portal</h1>

        <button onclick="changeHeading()">Change Heading</button>
        <button onclick="toggleTable()">Show/Hide Table</button>
        <button onclick="changeTheme()">Light/Dark Mode</button>

        <h2>Total Students: <span id="total">0</span></h2>

        <h2>Top Student: <span id="topStudent">Loading...</span></h2>

        <table id="studentTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Marks</th>
                </tr>
            </thead>

            <tbody id="studentData"></tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>
</html>
